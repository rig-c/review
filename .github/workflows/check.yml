name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  tree-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
      - id: reuse
        uses: rig-c/core/.github/actions/tree-verdict@08b45c6fbd3664a0dc77050c04b7359d2346f7a6
        with:
          declaration: scripts/tree-verdict.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Lint tree-verdict workflows
        env:
          TREE_VERDICT_TOOLS: ${{ steps.reuse.outputs.tooling-path }}
        run: bun "$TREE_VERDICT_TOOLS/../../../scripts/lint_workflows.ts" scripts/lint_workflows.declarations.json .
  check:
    needs: tree-verdict
    if: ${{ !cancelled() && needs.tree-verdict.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    # Recent full check: ~3 minutes; allow setup and shared-runner variance.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:readme
      - run: bun run check:screen-copies
      - run: bun run typecheck
      - name: Install reference video export tools
        timeout-minutes: 3
        uses: ./.github/actions/reference-video-tools
      - run: bun run test
      - run: bun run build
      - run: bun run check:demo
      - name: Verify Parts Explorer in Chrome
        shell: bash
        run: |
          chrome_bin="$(command -v google-chrome)"
          printf 'Chrome path: %s\n' "$chrome_bin"
          "$chrome_bin" --version
          unset NO_ASSERT SCREENSHOT_DIR SCREENSHOT_BASE64
          time CHROME_BIN="$chrome_bin" OUT_JSON="$RUNNER_TEMP/parts-explorer.json" bun tests/parts-explorer-browser.ts
      - name: Verify animation editor in Chrome
        timeout-minutes: 2
        shell: bash
        run: |
          chrome_bin="$(command -v google-chrome)"
          printf 'Chrome path: %s\n' "$chrome_bin"
          "$chrome_bin" --version
          time CHROME_BIN="$chrome_bin" bun tests/animation-editor-browser.ts
      - name: Upload Parts Explorer measurements
        uses: actions/upload-artifact@v4
        with:
          name: parts-explorer-measurements
          path: ${{ runner.temp }}/parts-explorer.json
          if-no-files-found: error
      - name: Restore CJK font for Parts camera
        id: cjk-font-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/noto-cjk
          key: noto-cjk-Sans2.004-NotoSansCJK-Regular.ttc-b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
      - name: Install CJK font for Parts camera
        timeout-minutes: 3
        shell: bash
        env:
          # Pinned to the Sans2.004 tag of notofonts/noto-cjk; the Ubuntu apt mirrors failed DNS on the runners.
          CJK_FONT_URL: https://github.com/notofonts/noto-cjk/raw/Sans2.004/Sans/OTC/NotoSansCJK-Regular.ttc
          CJK_FONT_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
        run: |
          font_dir="$HOME/.local/share/fonts/noto-cjk"
          font_file="$font_dir/NotoSansCJK-Regular.ttc"
          mkdir -p "$font_dir"
          if [ ! -f "$font_file" ]; then
            curl --retry 5 --retry-all-errors --fail -sSL -o "$font_file" "$CJK_FONT_URL"
          fi
          printf '%s  %s\n' "$CJK_FONT_SHA256" "$font_file" | sha256sum -c -
          fc-cache -f
          fc-list | grep -q "Noto Sans CJK"
      - name: Verify Parts camera in Chrome
        timeout-minutes: 2
        shell: bash
        run: |
          pkg_info="NotoSansCJK-Regular.ttc Sans2.004 sha256 $(sha256sum "$HOME/.local/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc" | cut -d' ' -f1)"
          ko_font="$(fc-match :lang=ko)"
          mkdir -p "$RUNNER_TEMP/parts-camera-race"
          printf 'font: %s\nfc-match :lang=ko: %s\n' "$pkg_info" "$ko_font" | tee "$RUNNER_TEMP/parts-camera-race/cjk-font.txt"
          chrome_bin="$(command -v google-chrome)"
          printf 'Chrome path: %s\n' "$chrome_bin"
          "$chrome_bin" --version
          time CHROME_BIN="$chrome_bin" REVIEW464_CAMERA_ARTIFACTS="$RUNNER_TEMP/parts-camera-race" bun tests/parts-camera-race-browser.ts
      - name: Verify Parts comments in Chrome
        timeout-minutes: 3
        shell: bash
        run: |
          chrome_bin="$(command -v google-chrome)"
          "$chrome_bin" --version
          time CHROME_BIN="$chrome_bin" bun tests/parts-comments-browser.ts
      - name: Upload Parts camera evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: parts-camera-race
          path: ${{ runner.temp }}/parts-camera-race/
          if-no-files-found: error
  install-smoke:
    needs: tree-verdict
    if: ${{ !cancelled() && needs.tree-verdict.outputs.reused != 'true' }}
    # What `npm i -D @rig-c/review` delivers, on the minimum Bun the package declares and on latest.
    # The `release` entry is the release job's own environment (setup-node with registry-url, so its
    # .npmrc is in use, and npm@latest), measured here so an npm change fails before a tag, not the cut.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.3.0, npm bundled', 'latest, npm bundled', 'latest, npm release']
    name: install-smoke (bun ${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.profile == '1.3.0, npm bundled' && '1.3.0' || 'latest' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ matrix.profile == 'latest, npm release' && 'https://registry.npmjs.org' || '' }}
      - name: Use the release job's npm
        if: ${{ matrix.profile == 'latest, npm release' }}
        run: |
          npm install -g npm@latest
          npm --version
      - run: bun run smoke
  tree-verdict-receipt:
    needs: [check, install-smoke]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: tools
        uses: rig-c/core/.github/actions/tree-verdict@08b45c6fbd3664a0dc77050c04b7359d2346f7a6
      - id: receipt
        env:
          TREE_VERDICT_TOOLS: ${{ steps.tools.outputs.tooling-path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun "$TREE_VERDICT_TOOLS/producer.mjs" --declaration scripts/tree-verdict.json --out "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.receipt.outputs.receipt-created == 'true' }}
        with:
          name: tree-verdict-receipt
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          overwrite: true
