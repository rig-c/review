name: Check
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  video-tools-cache:
    # Seed the archive in a separate runner so PR Check can measure a real restore.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install reference video export tools
        timeout-minutes: 3
        uses: ./.github/actions/reference-video-tools
  check:
    needs: video-tools-cache
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Recent full check: ~3 minutes; allow setup and shared-runner variance.
    timeout-minutes: 10
    steps:
      # A skipped required job can satisfy branch protection. Fail this job
      # explicitly if the PR seed did not complete successfully.
      - name: Require the expected video tools seed result
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SEED_RESULT: ${{ needs.video-tools-cache.result }}
        run: |
          case "$EVENT:$SEED_RESULT" in
            pull_request:success|push:skipped) ;;
            *)
              echo "::error::VIDEO_TOOLS_SEED: unexpected $EVENT seed result: $SEED_RESULT"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check:readme
      - run: bun run typecheck
      - name: Install reference video export tools
        timeout-minutes: 3
        uses: ./.github/actions/reference-video-tools
      - run: bun test
      - run: bun run build
      - run: bun run check -- examples/demo/review.json
  install-smoke:
    # What `npm i -D @rig-c/review` delivers, on the minimum Bun the package declares and on latest.
    # The `release` entry is the release job's own environment (setup-node with registry-url, so its
    # .npmrc is in use, and npm@latest), measured here so an npm change fails before a tag, not the cut.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {bun-version: '1.3.0', npm: bundled}
          - {bun-version: latest, npm: bundled}
          - {bun-version: latest, npm: release}
    name: install-smoke (bun ${{ matrix.bun-version }}, npm ${{ matrix.npm }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ matrix.npm == 'release' && 'https://registry.npmjs.org' || '' }}
      - name: Use the release job's npm
        if: ${{ matrix.npm == 'release' }}
        run: |
          npm install -g npm@latest
          npm --version
      - run: bun run smoke
